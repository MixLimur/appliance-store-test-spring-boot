<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <!-- Latest compiled and minified CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Latest compiled JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <title>Manufacturers list</title>
</head>
<body>
<div th:insert="~{menunavy::navy}"></div>
<h1 th:text="#{manufacturer.header.list}"></h1>
    <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}">
        Cannot delete entity.
    </div>
<table class="table table-hover">
    <thead>
    <tr class="table-dark">
        <th th:text="#{object.manufacturer.id}">ID</th>
        <th th:text="#{object.manufacturer.name}">Name</th>
        <th>Operation</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="manufacturer: ${manufacturers}">
        <td th:text="${manufacturer.id}"/>
        <td th:text="${manufacturer.name}"/>
        <td sec:authorize="hasRole('EMPLOYEE')">
            <a th:href="@{/manufacturers/{id}/delete(id=${manufacturer.id})}" class="text-danger me-2">
                <i class="fa fa-times"></i>
            </a>
            <a th:href="@{/manufacturers/{id}/edit(id=${manufacturer.id})}">
                <i class="fa fa-edit"></i>
            </a>
        </td>
    </tr>

    </tbody>
</table>
<a th:href="@{manufacturers/add}" class="btn btn-primary" th:text="#{manufacturer.btn.new}"></a>
<div th:insert="~{footer::footer}"></div>
</body>
</html>
