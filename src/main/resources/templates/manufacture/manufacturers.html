<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link th:href="@{/styles/css/main.css}" rel="stylesheet"/>
    <title>Manufacturers list</title>
</head>
<body>
<header>
    <div th:insert="~{menunavy::navy}"></div>
</header>
<main class="container mt-4">
    <h1 th:text="#{manufacturer.header.list}">Manufacturers list</h1>

    <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}">
        Cannot delete entity.
    </div>

    <form th:action="@{/manufacturers}" method="get" class="row g-3 mb-3">
        <input type="hidden" name="sortField" th:value="${sortField}"/>
        <input type="hidden" name="sortDir" th:value="${sortDir}"/>
        <input type="hidden" name="size" th:value="${size}"/>

        <div class="col-auto">
            <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Search manufacturers..."/>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary"><i class="fa fa-search"></i> Search</button>
            <a th:href="@{/manufacturers}" class="btn btn-outline-secondary">Clear</a>
        </div>
    </form>

    <table class="table table-hover align-middle">
        <thead>
        <tr class="table-dark">
            <th>
                <a th:href="@{/manufacturers(page=${currentPage}, size=${size}, sortField='id', sortDir=${sortField == 'id' ? reverseSortDir : 'asc'}, keyword=${keyword})}"
                   class="text-white text-decoration-none">
                    <span th:text="#{object.manufacturer.id}">ID</span>
                    <i th:if="${sortField == 'id'}" th:class="${sortDir == 'asc' ? 'fa fa-sort-asc' : 'fa fa-sort-desc'}"></i>
                </a>
            </th>
            <th>
                <a th:href="@{/manufacturers(page=${currentPage}, size=${size}, sortField='name', sortDir=${sortField == 'name' ? reverseSortDir : 'asc'}, keyword=${keyword})}"
                   class="text-white text-decoration-none">
                    <span th:text="#{object.manufacturer.name}">Name</span>
                    <i th:if="${sortField == 'name'}" th:class="${sortDir == 'asc' ? 'fa fa-sort-asc' : 'fa fa-sort-desc'}"></i>
                </a>
            </th>
            <th sec:authorize="hasRole('EMPLOYEE')">Operation</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="manufacturer: ${manufacturers}">
            <td th:text="${manufacturer.id}"/>
            <td th:text="${manufacturer.name}"/>
            <td sec:authorize="hasRole('EMPLOYEE')">
                <a th:href="@{/manufacturers/{id}/delete(id=${manufacturer.id})}" class="text-danger me-2">
                    <i class="fa fa-times"></i>
                </a>
                <a th:href="@{/manufacturers/{id}/edit(id=${manufacturer.id})}">
                    <i class="fa fa-edit"></i>
                </a>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="mb-3" sec:authorize="hasRole('EMPLOYEE')">
        <a th:href="@{/manufacturers/add}" class="btn btn-primary" th:text="#{manufacturer.btn.new}">New manufacturer</a>
    </div>

    <nav th:if="${totalPages > 1}" class="d-flex justify-content-between align-items-center">
        <div>
            Total items: <span th:text="${totalItems}"></span> | Page <span th:text="${currentPage + 1}"></span> of <span th:text="${totalPages}"></span>
        </div>
        <ul class="pagination mb-0">
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link" th:href="@{/manufacturers(page=${currentPage - 1}, size=${size}, sortField=${sortField}, sortDir=${sortDir}, keyword=${keyword})}">Previous</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                th:classappend="${i == currentPage} ? 'active'">
                <a class="page-link" th:href="@{/manufacturers(page=${i}, size=${size}, sortField=${sortField}, sortDir=${sortDir}, keyword=${keyword})}" th:text="${i + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                <a class="page-link" th:href="@{/manufacturers(page=${currentPage + 1}, size=${size}, sortField=${sortField}, sortDir=${sortDir}, keyword=${keyword})}">Next</a>
            </li>
        </ul>
    </nav>
</main>
<div th:insert="~{footer::footer}"></div>
</body>
</html>
