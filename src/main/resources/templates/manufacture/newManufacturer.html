<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link th:href="@{/styles/css/main.css}" rel="stylesheet"/>
    <title th:text="#{manufacturer.btn.new}">New Manufacturer</title>
</head>
<body>
<header>
    <div th:insert="~{menunavy::navy}"></div>
</header>
<main class="container mt-4">
    <h1 th:text="#{manufacturer.btn.new}">New Manufacturer</h1>

    <form th:action="@{/manufacturers/add-manufacturer}" th:object="${manufacturer}" method="post">
        <div class="mb-3">
            <label for="name" class="form-label" th:text="#{object.manufacturer.name}">Name</label>
            <input type="text" id="name" th:field="*{name}" class="form-control" th:errorclass="is-invalid"/>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <div class="btn-group">
            <button type="submit" class="btn btn-primary"><i class="fa fa-save"></i></button>
            <a th:href="@{/manufacturers}" class="btn btn-secondary"><i class="fa fa-arrow-left"></i></a>
        </div>
    </form>
</main>
<div th:insert="~{footer::footer}"></div>
</body>
</html>
