<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <!-- Latest compiled and minified CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Latest compiled JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link th:href="@{/styles/css/main.css}" rel="stylesheet"/>
    <title>Title</title>
</head>
<body>
<header>
    <div th:insert="~{menunavy::navy}"></div>
</header>
<main>
    <h1 th:text="#{orders.header.list}">Orders list</h1>
    <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}">
        Cannot approve an empty order.
    </div>
    <table class="table table-hover">
        <thead>
        <tr class="table-dark">
            <th>ID</th>
            <th>Client</th>
            <th>Employee</th>
            <th>Approved</th>
            <th>Amount</th>
            <th>Operation</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="order: ${orders}">
            <td><span class="float-end" th:text="${order.id}"/></td>
            <td><span class="float-end" th:text="${order.client.name}"/></td>
            <td><span class="float-end" th:text="${order.employee?.name}"/>
                <th:block sec:authorize="hasRole('EMPLOYEE')">
                    <div th:if="${order.employee == null and !order.approved}">
                        <a th:href="@{/orders/{id}/assign-self(id=${order.id})}" class="btn btn-sm btn-outline-primary">
                            Assign to me
                        </a>
                    </div>
                </th:block></td>
            <td>
                <th:block sec:authorize="hasRole('EMPLOYEE')">
                    <div th:if="${order.approved}">
                        <a th:href="@{orders/}+${order.id}+@{/unapproved}">
                          <span class="icon">
                            <i class="fa fa-check"></i>
                          </span>

                        </a>
                    </div>
                    <!-- ELSE -->
                    <div th:unless="${order.approved}">
                        <a th:href="@{orders/}+${order.id}+@{/approved}">
                        <span class="icon">
                              <i class="fa fa-minus"></i>
                        </span>

                        </a>
                    </div>
                </th:block>
                <th:block sec:authorize="hasRole('CLIENT')">
                    <span th:if="${order.approved}" class="badge bg-success">Approved</span>
                    <span th:unless="${order.approved}" class="badge bg-warning">Pending</span>
                </th:block>
            </td>
            <td><span class="float-end" th:text="${order.amount}"/></td>
            <td>
                <th:block th:unless="${order.approved}">
                    <div>
                        <a th:href="@{orders/}+${order.id}+@{/delete}" class="text-danger">
                            <i class="fa fa-times"></i>
                        </a>
                    </div>
                    <div>
                        <a th:href="@{orders/}+${order.id}+@{/edit}">
                            <i class="fa fa-edit"></i>
                        </a>
                    </div>
                </th:block>
                <th:block th:if="${order.approved}">
                    <span class="text-muted"><i class="fa fa-lock"></i></span>
                </th:block>

            </td>
        </tr>
        </tbody>
    </table>
    <a th:href="@{orders/add}" class="btn btn-primary" th:text="#{orders.btn.new}"></a>
</main>
<div th:insert="~{footer::footer}"></div>
</body>
</html>
