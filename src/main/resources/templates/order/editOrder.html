<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link th:href="@{/styles/css/main.css}" rel="stylesheet"/>
    <title th:text="#{order.menu.name}">Orders</title>
</head>
<body>
<header>
    <div th:insert="~{menunavy::navy}"></div>
</header>
<main class="container mt-4">
    <h1 th:text="#{order.menu.name}">Orders</h1>

    <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>

    <div th:object="${order}">
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <label class="form-label" th:text="#{object.order.id}">Order ID</label>
                <input type="text" class="form-control" th:field="*{id}" disabled/>
            </div>
            <div class="col-md-4">
                <label class="form-label" th:text="#{object.order.client}">Client</label>
                <input type="text" class="form-control" th:field="*{client.name}" disabled/>
            </div>
            <div class="col-md-4">
                <label class="form-label" th:text="#{object.order.employee}">Employee</label>
                <input type="text" class="form-control" th:value="${order.employee?.name}" disabled/>
            </div>
        </div>

        <table class="table table-hover align-middle">
            <thead>
            <tr class="table-dark">
                <th th:text="#{object.appliance.id}">ID</th>
                <th th:text="#{object.appliance.name}">Appliance</th>
                <th><i class="fa fa-hashtag"></i></th>
                <th th:text="#{object.appliance.price}">Price</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="row: ${rows}">
                <td th:text="${row.id}"/>
                <td th:text="${row.appliance.name}"/>
                <td>
                    <form th:unless="${order.approved}"
                          th:action="@{/orders/{orderId}/row/{rowId}/update(orderId=${order.id}, rowId=${row.id})}"
                          method="post" class="d-flex align-items-center gap-1" style="max-width: 150px;">
                        <input type="number" name="number" th:value="${row.number}" min="1" class="form-control form-control-sm" required/>
                        <button type="submit" class="btn btn-sm btn-outline-secondary">
                            <i class="fa fa-refresh"></i>
                        </button>
                    </form>
                    <span th:if="${order.approved}" th:text="${row.number}"></span>
                </td>
                <td th:text="${row.amount}"/>
                <td>
                    <div th:unless="${order.approved}">
                        <a th:href="@{/orders/{orderId}/row/{rowId}/delete(orderId=${order.id}, rowId=${row.id})}" class="text-danger">
                            <i class="fa fa-times"></i>
                        </a>
                    </div>
                    <div th:if="${order.approved}">
                        <span class="text-muted"><i class="fa fa-lock"></i></span>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>

        <div th:if="${order.approved}" class="alert alert-info mt-3" th:text="#{error.orders.approved.modify}"></div>

        <div class="btn-group mt-2">
            <a th:unless="${order.approved}" th:href="@{/orders/{id}/choice-appliance(id=${order.id})}" class="btn btn-success">
                <i class="fa fa-plus"></i>
            </a>
            <a th:href="@{/orders}" class="btn btn-secondary">
                <i class="fa fa-arrow-left"></i>
            </a>
        </div>
    </div>
</main>
<div th:insert="~{footer::footer}"></div>
</body>
</html>
