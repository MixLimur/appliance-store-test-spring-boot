<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <!-- Latest compiled and minified CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Latest compiled JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <title>Manufacturers list</title>
</head>
<body>
<div th:insert="~{menunavy::navy}"></div>
<h1 th:text="#{orders.btn.new}"></h1>
<form action="#" th:action="@{add-order}" th:object="${order}" method="post">

    <div th:if="${#fields.hasErrors('orderRowSet')}" class="alert alert-danger mb-3" th:errors="*{orderRowSet}">
        Validation error message
    </div>

    <p>
        <span th:text="#{object.order.client}">Client</span>

        <th:block sec:authorize="hasRole('EMPLOYEE')">
            <select th:field="*{clientId}" class="form-select">
                <option th:each="client : ${clients}" th:value="${client.id}" th:text="${client.name}"></option>
            </select>
            <span th:if="${#fields.hasErrors('clientId')}" class="text-danger" th:errors="*{clientId}">Invalid client</span>
        </th:block>

        <th:block sec:authorize="hasRole('CLIENT')">
            <input type="text" class="form-control" th:value="${currentClientName}" disabled />
            <input type="hidden" th:field="*{clientId}" />
        </th:block>
    </p>

    <div class="btn-group">
        <button type="submit" class="btn btn-primary">Create</button>
        <input type="reset" class="btn btn-secondary" value="Reset"/>
    </div>
</form>

<div th:insert="~{footer::footer}"></div>
</body>
</html>
