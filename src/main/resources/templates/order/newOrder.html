<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link th:href="@{/styles/css/main.css}" rel="stylesheet"/>
    <title th:text="#{orders.btn.new}">New Order</title>
</head>
<body>
<header>
    <div th:insert="~{menunavy::navy}"></div>
</header>
<main class="container mt-4">
    <h1 th:text="#{orders.btn.new}">New Order</h1>

    <form th:action="@{/orders/add-order}" th:object="${order}" method="post">
        <div th:if="${#fields.hasErrors('orderRowSet')}" class="alert alert-danger mb-3" th:errors="*{orderRowSet}"></div>

        <div class="mb-3">
            <label class="form-label" th:text="#{object.order.client}">Client</label>

            <th:block sec:authorize="hasRole('EMPLOYEE')">
                <select th:field="*{clientId}" class="form-select" th:errorclass="is-invalid">
                    <option th:each="client : ${clients}" th:value="${client.id}" th:text="${client.name}"></option>
                </select>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('clientId')}" th:errors="*{clientId}"></div>
            </th:block>

            <th:block sec:authorize="hasRole('CLIENT')">
                <input type="text" class="form-control" th:value="${currentClientName}" disabled/>
                <input type="hidden" th:field="*{clientId}"/>
            </th:block>
        </div>

        <div class="btn-group">
            <button type="submit" class="btn btn-primary"><i class="fa fa-save"></i></button>
            <a th:href="@{/orders}" class="btn btn-secondary"><i class="fa fa-arrow-left"></i></a>
        </div>
    </form>
</main>
<div th:insert="~{footer::footer}"></div>
</body>
</html>
