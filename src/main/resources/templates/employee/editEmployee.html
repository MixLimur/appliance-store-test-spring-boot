<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link th:href="@{/static/css/main.css}" rel="stylesheet"/>
    <title>Edit Employee</title>
</head>
<body>
<header>
    <div th:insert="~{menunavy::navy}"></div>
</header>
<main class="container mt-4">
    <h1>Edit Employee</h1>
    <form th:action="@{/employees/{id}/edit(id=${employee.id})}" th:object="${employee}" method="post">
        <input type="hidden" th:field="*{id}"/>

        <div class="mb-3">
            <label for="name" class="form-label" th:text="#{object.employee.name}">Name</label>
            <input type="text" id="name" th:field="*{name}" class="form-control" th:errorclass="is-invalid"/>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label" th:text="#{object.employee.email}">Email</label>
            <input type="email" id="email" th:field="*{email}" class="form-control" th:errorclass="is-invalid"/>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>

        <div class="mb-3">
            <label for="department" class="form-label" th:text="#{object.employee.department}">Department</label>
            <input type="text" id="department" th:field="*{department}" class="form-control" th:errorclass="is-invalid"/>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></div>
        </div>

        <div class="btn-group">
            <button type="submit" class="btn btn-primary">Save</button>
            <a th:href="@{/employees}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</main>
<div th:insert="~{footer::footer}"></div>
</body>
</html>
