<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<div th:fragment="navy">
    <nav class="navbar navbar-expand-sm bg-primary navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/" th:text="#{shop.name}"></a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav">
                    <li class="nav-item" sec:authorize="hasRole('EMPLOYEE')">
                        <a class="nav-link" th:href="@{/clients}" th:text="#{clients.menu.name}"></a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('EMPLOYEE')">
                        <a class="nav-link" th:href="@{/employees}" th:text="#{employees.menu.name}"></a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('EMPLOYEE')">
                        <a class="nav-link" th:href="@{/manufacturers}" th:text="#{manufacturers.menu.name}"></a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('EMPLOYEE')">
                        <a class="nav-link" th:href="@{/appliances}" th:text="#{appliances.menu.name}"></a>
                    </li>
                    <li class="nav-item" sec:authorize="hasAnyRole('EMPLOYEE', 'CLIENT')">
                        <a class="nav-link" th:href="@{/orders}" th:text="#{order.menu.name}"></a>
                    </li>
                </ul>
                <ul class="navbar-nav ms-auto border-end pe-3 me-3">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle text-light" href="#" id="langDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false" th:text="#{nav.lang}">
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="langDropdown">
                            <li><a class="dropdown-item" th:href="@{''(lang='en')}">English</a></li>
                            <li><a class="dropdown-item" th:href="@{''(lang='uk')}">Українська</a></li>
                        </ul>
                    </li>
                </ul>
                <ul class="navbar-nav ms-auto" sec:authorize="isAuthenticated()">
                    <li class="nav-item">
                        <span class="nav-link text-light" sec:authentication="name">User</span>
                    </li>
                    <li class="nav-item">
                        <form th:action="@{/logout}" method="post" class="m-0 p-0">
                            <button type="submit" class="nav-link bg-transparent border-0" th:text="#{logout.btn}" style="cursor: pointer;">
                                Logout
                            </button>
                        </form>
                    </li>
                </ul>
                <ul class="navbar-nav ms-auto" sec:authorize="isAnonymous()">
                    <li class="nav-item">
                        <a class="nav-link btn btn-outline-light ms-2" th:href="@{/login}" th:text="#{login.btn}">Login</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</div>
<div th:fragment="line">
    <nav class="navbar navbar-expand-sm bg-primary navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Appliance store</a>
        </div>
    </nav>
</div>
</body>
</html>
