<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <title th:text="#{error.403.title}">Access Denied</title>
</head>
<body>
<header>
    <div th:insert="~{menunavy::navy}"></div>
</header>
<main class="container mt-5 text-center">
    <div class="alert alert-danger" role="alert">
        <h1 class="display-1">403</h1>
        <h2 class="mb-4" th:text="#{error.403.title}">Access Denied</h2>
        <p class="lead" th:text="#{error.403.message}">You do not have permission to access this page.</p>
        <hr>
        <a th:href="@{/}" class="btn btn-primary mt-3" th:text="#{error.btn.home}">Home</a>
    </div>
</main>
<div th:insert="~{footer::footer}"></div>
</body>
</html>
