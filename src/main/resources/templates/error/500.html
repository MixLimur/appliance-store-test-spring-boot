<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link th:href="@{/styles/css/main.css}" rel="stylesheet"/>
  <title th:text="#{error.500.title}">Server Error</title>
</head>
<body>
<header>
  <div th:insert="~{menunavy::navy}"></div>
</header>
<main class="container mt-5 text-center">
  <div class="alert alert-danger" role="alert">
    <h1 class="display-1">500</h1>
    <h2 class="mb-4" th:text="#{error.500.title}">Server Error</h2>
    <p class="lead" th:text="#{error.500.message}">An internal server error occurred.</p>
    <hr>
    <a th:href="@{/}" class="btn btn-primary mt-3">
      <i class="fa fa-home me-1"></i>
      <span th:text="#{error.btn.home}">Home</span>
    </a>
  </div>
</main>
<div th:insert="~{footer::footer}"></div>
</body>
</html>
