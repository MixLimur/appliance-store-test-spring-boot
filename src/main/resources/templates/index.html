<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link th:href="@{/styles/css/main.css}" rel="stylesheet"/>
    <title th:text="#{shop.name}">Appliance Store</title>
</head>
<body>
<header>
    <div th:insert="~{menunavy::navy}"></div>
</header>
<main class="container mt-5">
    <div class="p-5 mb-4 bg-light rounded-3 text-center shadow-sm">
        <div class="container-fluid py-3">
            <h1 class="display-4 fw-bold" th:text="#{shop.name}">Appliance Store</h1>
            <div class="d-flex justify-content-center gap-3 mt-4" sec:authorize="isAnonymous()">
                <a th:href="@{/login}" class="btn btn-primary btn-lg">
                    <i class="fa fa-sign-in me-1"></i>
                    <span th:text="#{login.btn}">Login</span>
                </a>
            </div>
            <div class="d-flex justify-content-center gap-3 mt-4" sec:authorize="isAuthenticated()">
                <a th:href="@{/orders}" class="btn btn-primary btn-lg">
                    <i class="fa fa-shopping-bag me-1"></i>
                    <span th:text="#{order.menu.name}">Orders</span>
                </a>
                <a th:href="@{/appliances}" class="btn btn-outline-secondary btn-lg" sec:authorize="hasRole('EMPLOYEE')">
                    <i class="fa fa-desktop me-1"></i>
                    <span th:text="#{appliances.menu.name}">Appliances</span>
                </a>
            </div>
        </div>
    </div>
</main>
<div th:insert="~{footer::footer}"></div>
</body>
</html>
