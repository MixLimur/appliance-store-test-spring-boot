<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link th:href="@{/styles/css/main.css}" rel="stylesheet"/>
    <title th:text="#{login.title}">Login</title>
</head>
<body>
<header>
    <div th:insert="~{menunavy::navy}"></div>
</header>

<main class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <h2 class="text-center mb-4" th:text="#{login.title}">Login</h2>

            <div th:if="${param.error}" class="alert alert-danger" role="alert" th:text="#{login.error.message}"></div>

            <div th:if="${param.logout}" class="alert alert-success" role="alert" th:text="#{login.logout.message}"></div>

            <form th:action="@{/login}" method="post" class="border p-4 bg-light rounded shadow-sm">
                <div class="mb-3">
                    <label for="username" class="form-label" th:text="#{login.email}">Email address</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa fa-envelope"></i></span>
                        <input type="email" id="username" name="username" class="form-control" required autofocus/>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label" th:text="#{login.password}">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa fa-lock"></i></span>
                        <input type="password" id="password" name="password" class="form-control" required/>
                    </div>
                </div>

                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary">
                        <i class="fa fa-sign-in me-1"></i>
                        <span th:text="#{login.btn}">Sign in</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</main>

<div th:insert="~{footer::footer}"></div>
</body>
</html>
