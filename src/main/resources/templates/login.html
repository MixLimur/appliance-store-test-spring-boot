<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <title th:text="#{login.title}">Login</title>
</head>
<body>
<div th:insert="~{menunavy::navy}"></div>

<main class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <h2 class="text-center mb-4" th:text="#{login.title}">Login</h2>

            <!-- Повідомлення про помилку авторизації -->
            <div th:if="${param.error}" class="alert alert-danger" th:text="#{login.error.message}">
                Invalid email or password.
            </div>

            <!-- Повідомлення про успішний вихід -->
            <div th:if="${param.logout}" class="alert alert-success" th:text="#{login.logout.message}">
                You have been logged out.
            </div>

            <form th:action="@{/login}" method="post" class="border p-4 bg-light rounded">
                <div class="mb-3">
                    <label for="username" class="form-label" th:text="#{login.email}">Email</label>
                    <!-- Зверніть увагу: name="username", хоча ми вводимо email -->
                    <input type="email" id="username" name="username" class="form-control" required autofocus/>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label" th:text="#{login.password}">Password</label>
                    <input type="password" id="password" name="password" class="form-control" required/>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary" th:text="#{login.btn}">Sign in</button>
                </div>
            </form>
        </div>
    </div>
</main>

<div th:insert="~{footer::footer}"></div>
</body>
</html>
